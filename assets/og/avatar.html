<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!--
  TracineHQ org avatar. 512x512 CSS px, captured at deviceScaleFactor 2 => 1024x1024.
  The tracine.dev favicon mark, kept inside the circle GitHub crops avatars to in some views.
-->
<style>
:root{--bg:#0f0e0c;--phosphor:#ffb641}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:512px;height:512px;overflow:hidden;background:var(--bg)}
body{display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 45%,rgba(255,182,65,.10),transparent 70%),var(--bg)}
svg{width:377px;height:406px;color:var(--phosphor);filter:drop-shadow(0 0 18px rgba(255,182,65,.35))}
</style>
</head>
<body>
<svg viewBox="0 0 54 58" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><circle cx="27" cy="9" r="6.5" fill="currentColor" stroke="none"/><circle cx="11" cy="34" r="6" fill="currentColor" stroke="none"/><circle cx="43" cy="34" r="6" fill="currentColor" stroke="none"/><circle cx="27" cy="50" r="5.5" fill="currentColor" stroke="none"/><path d="M27 9 11 34M27 9l16 25M11 34l16 16M43 34 27 50"/></svg>
</body>
</html>
